name: Terraform PR

# Validate infrastructure changes on every pull request.
on:
  pull_request:

# PR validation requires repository read access only.
# No cloud credentials are granted to this workflow.
permissions:
  contents: read


jobs:

  # ============================================================
  # Terraform validation
  # ============================================================
  #
  # IMPORTANT:
  # Keep the job name "Terraform validate".
  # Main branch protection requires this exact status context.
  terraform-check:
    name: Terraform validate

    runs-on: ubuntu-24.04

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v6


      # --------------------------------------------------------
      # Terraform
      # --------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

        with:
          terraform_version: "1.15.8"


      # --------------------------------------------------------
      # Formatting
      # --------------------------------------------------------
      - name: Terraform format
        run: |
          terraform fmt -check -recursive


      # --------------------------------------------------------
      # Retired AWS environment
      # --------------------------------------------------------
      #
      # environments/dev is intentionally retained only as a
      # tombstone for the retired AWS EKS environment.
      #
      # Backend access is disabled because PR validation must not
      # access historical AWS remote state.
      - name: Validate retired AWS environment
        working-directory: environments/dev

        run: |
          terraform init \
            -backend=false \
            -input=false

          terraform validate


      # --------------------------------------------------------
      # OCI environment
      # --------------------------------------------------------
      #
      # Validate the active OCI Terraform configuration without
      # connecting to the OCI remote backend.
      #
      # terraform validate does not create, modify, or destroy
      # cloud infrastructure.
      - name: Validate OCI environment
        working-directory: environments/oci-dev

        run: |
          terraform init \
            -backend=false \
            -input=false

          terraform validate


      # --------------------------------------------------------
      # IaC security scan
      # --------------------------------------------------------
      - name: Trivy IaC scan
        uses: aquasecurity/trivy-action@v0.36.0

        with:
          scan-type: config
          scan-ref: "."
          trivy-config: trivy.yaml
          severity: HIGH,CRITICAL
          exit-code: "1"


  # ============================================================
  # Terraform plan safety gate
  # ============================================================
  #
  # IMPORTANT:
  # Main branch protection currently requires the exact status
  # context "Terraform plan".
  #
  # OCI cloud-connected planning is intentionally NOT performed
  # here until non-interactive OCI CI authentication is designed.
  #
  # Instead this job proves:
  #
  # 1. retired AWS cannot recreate infrastructure;
  # 2. the retired configuration produces a no-op plan;
  # 3. OCI is the active infrastructure environment.
  terraform-plan:
    name: Terraform plan

    needs:
      - terraform-check

    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v6


      # --------------------------------------------------------
      # Terraform
      # --------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

        with:
          terraform_version: "1.15.8"


      # --------------------------------------------------------
      # AWS retirement guard
      # --------------------------------------------------------
      #
      # Fail immediately if executable Terraform blocks are ever
      # reintroduced into environments/dev.
      - name: Guard retired AWS environment
        shell: bash

        run: |
          set -euo pipefail

          if grep \
            -R \
            -n \
            -E \
            --include='*.tf' \
            '^[[:space:]]*(resource|module|data|provider|variable|output)[[:space:]]+"' \
            environments/dev
          then
            echo "::error::Retired AWS environment contains executable Terraform blocks."
            exit 1
          fi

          echo "Retired AWS environment contains no executable infrastructure blocks."


      # --------------------------------------------------------
      # AWS tombstone no-op plan
      # --------------------------------------------------------
      #
      # backend.tf is intentionally excluded because this plan
      # must remain completely disconnected from AWS.
      - name: Plan retired AWS tombstone
        shell: bash

        run: |
          set -euo pipefail

          VALIDATION_DIR="${RUNNER_TEMP}/retired-aws-plan"

          rm -rf "${VALIDATION_DIR}"
          mkdir -p "${VALIDATION_DIR}"

          cp \
            environments/dev/versions.tf \
            "${VALIDATION_DIR}/versions.tf"

          terraform \
            -chdir="${VALIDATION_DIR}" \
            init \
            -backend=false \
            -input=false

          terraform \
            -chdir="${VALIDATION_DIR}" \
            plan \
            -refresh=false \
            -lock=false \
            -input=false \
            -no-color


      # --------------------------------------------------------
      # Active-platform guard
      # --------------------------------------------------------
      - name: Verify OCI is the active infrastructure target
        shell: bash

        run: |
          set -euo pipefail

          test -f environments/oci-dev/main.tf
          test -f environments/oci-dev/providers.tf

          grep \
            -q \
            'provider "oci"' \
            environments/oci-dev/providers.tf

          grep \
            -q \
            'module "oke"' \
            environments/oci-dev/main.tf

          echo "OCI OKE Terraform is the active infrastructure target."


      # --------------------------------------------------------
      # Explicit CI planning policy
      # --------------------------------------------------------
      - name: OCI cloud plan policy
        run: |
          echo "OCI configuration was validated successfully."
          echo "Cloud-connected OCI terraform plan is intentionally disabled in PR CI."
          echo "OCI CI authentication will be introduced separately."