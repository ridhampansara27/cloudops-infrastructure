name: Terraform Apply

# Never run automatically.
on:
  workflow_dispatch:


permissions:
  contents: read
  id-token: write


# Never allow two Terraform applies to modify the same
# development state simultaneously.
concurrency:
  group: terraform-development-infrastructure
  cancel-in-progress: false



jobs:

  apply:
    name: Terraform apply

    # Only allow infrastructure changes from main.
    if: github.ref == 'refs/heads/main'

    # Use a protected GitHub Environment for manual approval.
    environment: development-infrastructure

    runs-on: ubuntu-24.04

    # Supply environment-specific Terraform input values.
    env:
      TF_VAR_aws_account_id: ${{ vars.AWS_ACCOUNT_ID }}
      TF_VAR_cluster_endpoint_public_access_cidrs: ${{ vars.EKS_PUBLIC_ACCESS_CIDRS }}
      TF_VAR_eks_admin_principal_arn: ${{ vars.EKS_ADMIN_PRINCIPAL_ARN }}

    steps:

      # Checkout the exact approved commit.
      - name: Checkout

        uses: actions/checkout@v6


      # Install Terraform.
      - name: Setup Terraform

        uses: hashicorp/setup-terraform@v4

        with:
          terraform_version: "1.15.8"


      # Obtain temporary AWS credentials.
      - name: Configure AWS credentials

        uses: aws-actions/configure-aws-credentials@v6.2.3

        with:
          role-to-assume: ${{ vars.TERRAFORM_APPLY_ROLE_ARN }}

          aws-region: eu-central-1


      # Initialize remote Terraform state.
      - name: Terraform init

        working-directory: environments/dev

        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TERRAFORM_STATE_BUCKET }}"


      # Recreate the plan inside the approved workflow.
      - name: Terraform plan

        working-directory: environments/dev

        run: |
          terraform plan \
            -input=false \
            -out=approved.tfplan


      # Apply exactly the generated plan.
      - name: Terraform apply

        working-directory: environments/dev

        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            approved.tfplan